[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-sop-translator"
version = "0.1.0"
description = "Deterministic no-AI translation memory and DOCX formatter"
requires-python = ">=3.11"
dependencies = ["lxml==6.1.2", "python-docx==1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "lxml-stubs>=0.5"]

[project.scripts]
translator = "translator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["translator"]

[[tool.mypy.overrides]]
module = [
  "translator.document.*",
  "translator.formatting.*",
  "translator.qa.structural"
]
disable_error_code = ["arg-type", "union-attr", "index", "assignment"]
